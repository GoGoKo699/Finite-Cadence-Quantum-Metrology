name: Hosted mathematics capture
on:
  push:
    branches: [verification/hosted-capture]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAPTURE_REVISION: d51aade1d17138d94824d985918b444a735a12fd
    steps:
      - name: Check out collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: collector
          persist-credentials: false
      - name: Check out exact scientific revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          path: source
          persist-credentials: false
      - name: Install pinned capture dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture exact GitHub pages at both widths
        run: |
          NODE_PATH="$RUNNER_TEMP/hosted-deps/node_modules" node collector/verification/hosted/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE/source" --repository "GoGoKo699/Finite-Cadence-Quantum-Metrology" --revision "$CAPTURE_REVISION" --output "$RUNNER_TEMP/hosted-evidence" --contract "$GITHUB_WORKSPACE/collector/verification/hosted/math-contract.json"
      - name: Preserve capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-evidence
          path: ${{ runner.temp }}/hosted-evidence
          if-no-files-found: error
          retention-days: 14
